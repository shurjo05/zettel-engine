[project]
name = "zettel-engine"
version = "0.1.0"
description = "Index, search and maintain an Obsidian Zettelkasten for AI tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.7",
    "mcp>=2.3",
    "pyyaml>=6.0",
]

[project.scripts]
zk = "zk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
